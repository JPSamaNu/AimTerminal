[package]
name = "rt"
version = "0.2.0"
edition = "2024"

[dependencies]
fastrand = "2"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No se usan directamente: fijan las versiones que trae crossterm. Las más nuevas usan
# raw-dylib y con el toolchain GNU necesitan dlltool con ensamblador, que rustup no instala.
parking_lot = "=0.12.3"
parking_lot_core = "=0.9.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
